name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      - name: Giai nen zip
        run: |
          mkdir -p src
          for z in *.zip; do unzip -o "$z" -d src; done

      - name: Tim thu muc project
        id: find
        run: |
          f=$(find src -name 'settings.gradle*' -not -path '*/node_modules/*' | head -n 1)
          if [ -z "$f" ]; then echo "Khong thay settings.gradle trong zip"; exit 1; fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: GameBox-debug-apk
          path: ${{ steps.find.outputs.dir }}/**/build/outputs/apk/debug/*.apk
